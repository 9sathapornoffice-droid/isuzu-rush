<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2A38"/>
      <stop offset="60%" stop-color="#D90011"/>
      <stop offset="100%" stop-color="#9E000A"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B6584"/>
      <stop offset="100%" stop-color="#1E272C"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="50%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
  </defs>

  <!-- Truck Cab and Bed Body -->
  <path d="M 12 55 L 148 55 C 154 55 158 50 156 42 L 152 35 L 105 35 L 85 14 C 82 10 77 10 70 10 L 40 10 C 35 10 28 15 22 25 L 10 40 C 6 45 6 52 12 55 Z" fill="url(#bodyGrad)" stroke="#111" stroke-width="2.5"/>

  <!-- Rear Bed Wall Line -->
  <path d="M 106 35 L 106 52" stroke="#600006" stroke-width="3" stroke-linecap="round"/>

  <!-- Window glass -->
  <path d="M 43 14 L 68 14 C 71 14 74 15 76 18 L 88 33 L 30 33 L 38 18 C 39 15 41 14 43 14 Z" fill="url(#glassGrad)" stroke="#111" stroke-width="1.5"/>
  <!-- Window Pillar Divider -->
  <line x1="58" y1="14" x2="58" y2="33" stroke="#222" stroke-width="2.5"/>

  <!-- Front Headlight with glow -->
  <polygon points="8,42 16,40 15,48 7,46" fill="#FFF7C2" stroke="#FFA000" stroke-width="1"/>

  <!-- Front Bumper / Skid Plate -->
  <path d="M 5 48 L 18 48 L 18 58 L 7 57 Z" fill="#263238" stroke="#111" stroke-width="1.5"/>
  <rect x="8" y="52" width="8" height="3" fill="url(#chromeGrad)" rx="1"/>

  <!-- Rear Bumper & Taillight -->
  <rect x="153" y="40" width="4" height="10" fill="#FF1744" rx="1"/>
  <rect x="146" y="52" width="10" height="6" fill="#263238" stroke="#111" stroke-width="1"/>

  <!-- Dynamic Side Decal / Stripe -->
  <path d="M 22 45 L 95 45 L 88 49 L 20 49 Z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M 98 45 L 140 45 L 138 48 L 97 48 Z" fill="#FF8A80" opacity="0.9"/>

  <!-- Door Handle -->
  <rect x="64" y="37" width="10" height="2.5" fill="#111" rx="1"/>

  <!-- Wheel Wells / Fenders Cutouts -->
  <!-- Front Wheel Well -->
  <path d="M 22 62 A 16 16 0 0 1 54 62 Z" fill="#111111"/>
  <!-- Rear Wheel Well -->
  <path d="M 106 62 A 16 16 0 0 1 138 62 Z" fill="#111111"/>
  
  <!-- Subtle roof rack / spoiler -->
  <path d="M 45 8 L 80 8" stroke="#37474F" stroke-width="3" stroke-linecap="round"/>
</svg>
