<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Outer Tire Rubber -->
  <circle cx="20" cy="20" r="19" fill="#1A1A1A" stroke="#333" stroke-width="1.5"/>
  <circle cx="20" cy="20" r="15" fill="#262626"/>
  <!-- Tire treads -->
  <line x1="20" y1="1" x2="20" y2="5" stroke="#444" stroke-width="2"/>
  <line x1="20" y1="35" x2="20" y2="39" stroke="#444" stroke-width="2"/>
  <line x1="1" y1="20" x2="5" y2="20" stroke="#444" stroke-width="2"/>
  <line x1="35" y1="20" x2="39" y2="20" stroke="#444" stroke-width="2"/>
  <line x1="7" y1="7" x2="10" y2="10" stroke="#444" stroke-width="2"/>
  <line x1="30" y1="30" x2="33" y2="33" stroke="#444" stroke-width="2"/>
  <line x1="7" y1="33" x2="10" y2="30" stroke="#444" stroke-width="2"/>
  <line x1="30" y1="10" x2="33" y2="7" stroke="#444" stroke-width="2"/>

  <!-- Alloy Rim -->
  <circle cx="20" cy="20" r="12" fill="#9E9E9E" stroke="#E0E0E0" stroke-width="1.5"/>
  <!-- Spokes -->
  <circle cx="20" cy="20" r="6" fill="#424242"/>
  <line x1="20" y1="8" x2="20" y2="32" stroke="#424242" stroke-width="3"/>
  <line x1="8" y1="20" x2="32" y2="20" stroke="#424242" stroke-width="3"/>
  <!-- Center Cap -->
  <circle cx="20" cy="20" r="3.5" fill="#E60012"/>
  <circle cx="20" cy="20" r="1.5" fill="#FFF"/>
</svg>
