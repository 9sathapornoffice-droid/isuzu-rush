<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <linearGradient id="truckObstacleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3344"/>
      <stop offset="60%" stop-color="#DD0000"/>
      <stop offset="100%" stop-color="#880000"/>
    </linearGradient>
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
  </defs>

  <!-- Isuzu D-Max Pickup Truck Obstacle -->
  <!-- Cab & Bed -->
  <path d="M 12 55 L 148 55 C 154 55 158 50 156 42 L 152 35 L 105 35 L 85 14 C 82 10 77 10 70 10 L 40 10 C 35 10 28 15 22 25 L 10 40 C 6 45 6 52 12 55 Z" fill="url(#truckObstacleGrad)" stroke="#111" stroke-width="2.5"/>

  <!-- Window glass -->
  <path d="M 43 14 L 68 14 C 71 14 74 15 76 18 L 88 33 L 30 33 L 38 18 C 39 15 41 14 43 14 Z" fill="url(#windshieldGrad)" stroke="#111" stroke-width="1.5"/>
  <line x1="58" y1="14" x2="58" y2="33" stroke="#222" stroke-width="2.5"/>

  <!-- Headlight -->
  <polygon points="8,42 16,40 15,48 7,46" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1"/>

  <!-- Front Bumper -->
  <path d="M 5 48 L 18 48 L 18 58 L 7 57 Z" fill="#212121" stroke="#111" stroke-width="1.5"/>

  <!-- Rear Bed Partition -->
  <line x1="106" y1="35" x2="106" y2="52" stroke="#550000" stroke-width="3"/>

  <!-- ISUZU Tailgate Decal -->
  <text x="128" y="47" font-family="'Kanit', sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">ISUZU</text>

  <!-- Wheels -->
  <circle cx="38" cy="62" r="14" fill="#212121" stroke="#333" stroke-width="2"/>
  <circle cx="38" cy="62" r="7" fill="#B0BEC5"/>
  <circle cx="122" cy="62" r="14" fill="#212121" stroke="#333" stroke-width="2"/>
  <circle cx="122" cy="62" r="7" fill="#B0BEC5"/>
</svg>
