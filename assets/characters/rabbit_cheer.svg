<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <defs>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6FCF"/>
      <stop offset="60%" stop-color="#4A5BB5"/>
      <stop offset="100%" stop-color="#32418C"/>
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
  </defs>

  <!-- Left & Right Ears (Up high with joy) -->
  <path d="M 48 70 C 32 35 30 5 44 2 C 56 -2 64 30 60 68 Z" fill="url(#furGrad)" stroke="#222" stroke-width="2.5"/>
  <path d="M 48 60 C 38 35 36 12 44 8 C 52 4 56 30 54 58 Z" fill="#FFAEC9"/>

  <path d="M 102 70 C 118 35 120 5 106 2 C 94 -2 86 30 90 68 Z" fill="url(#furGrad)" stroke="#222" stroke-width="2.5"/>
  <path d="M 102 60 C 112 35 114 12 106 8 C 98 4 94 30 96 58 Z" fill="#FFAEC9"/>

  <circle cx="34" cy="165" r="14" fill="#FFFFFF" stroke="#222" stroke-width="2"/>

  <!-- Legs -->
  <rect x="52" y="160" width="16" height="28" fill="#4A5BB5" rx="4"/>
  <ellipse cx="54" cy="195" rx="18" ry="10" fill="#DD0000" stroke="#222" stroke-width="2"/>
  <path d="M 40 196 L 68 196" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>

  <rect x="82" y="160" width="16" height="28" fill="#4A5BB5" rx="4"/>
  <ellipse cx="94" cy="195" rx="18" ry="10" fill="#DD0000" stroke="#222" stroke-width="2"/>
  <path d="M 80 196 L 108 196" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Body -->
  <path d="M 44 115 L 106 115 C 112 115 116 128 114 162 C 114 168 108 172 100 172 L 50 172 C 42 172 36 168 36 162 C 34 128 38 115 44 115 Z" fill="url(#suitGrad)" stroke="#222" stroke-width="2.5"/>

  <path d="M 52 115 L 75 132 L 98 115 Z" fill="#DD0000" stroke="#222" stroke-width="1.5"/>
  <rect x="42" y="152" width="66" height="8" fill="#222" rx="2"/>
  <rect x="70" y="150" width="10" height="12" fill="#FFD700" stroke="#222" stroke-width="1.2" rx="2"/>

  <ellipse cx="60" cy="138" rx="8" ry="5" fill="#FFFFFF" stroke="#DD0000" stroke-width="1.2"/>
  <text x="60" y="141" font-family="sans-serif" font-weight="900" font-size="5" fill="#DD0000" text-anchor="middle">TSH</text>

  <!-- Both Arms Raised in Cheering V-pose -->
  <path d="M 44 124 L 20 98 C 16 94 22 88 27 92 L 48 116 Z" fill="url(#suitGrad)" stroke="#222" stroke-width="2"/>
  <circle cx="20" cy="94" r="8" fill="#FFFFFF" stroke="#222" stroke-width="1.5"/>

  <path d="M 106 124 L 130 98 C 134 94 128 88 123 92 L 102 116 Z" fill="url(#suitGrad)" stroke="#222" stroke-width="2"/>
  <circle cx="130" cy="94" r="8" fill="#FFFFFF" stroke="#222" stroke-width="1.5"/>

  <!-- Head -->
  <ellipse cx="75" cy="90" rx="36" ry="32" fill="url(#furGrad)" stroke="#222" stroke-width="2.5"/>
  <ellipse cx="50" cy="98" rx="6" ry="4" fill="#FFB7B2" opacity="0.6"/>
  <ellipse cx="100" cy="98" rx="6" ry="4" fill="#FFB7B2" opacity="0.6"/>

  <!-- Happy Cheering Eyes -->
  <ellipse cx="62" cy="85" rx="6.5" ry="9" fill="#1A1A1A"/>
  <circle cx="60" cy="82" r="2.5" fill="#FFFFFF"/>
  <ellipse cx="88" cy="85" rx="6.5" ry="9" fill="#1A1A1A"/>
  <circle cx="86" cy="82" r="2.5" fill="#FFFFFF"/>

  <polygon points="75,93 72,90 78,90" fill="#FF7597"/>
  <path d="M 68 96 Q 75 106 82 96 Z" fill="#C62828" stroke="#222" stroke-width="1.8"/>

  <line x1="42" y1="92" x2="28" y2="90" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="96" x2="28" y2="98" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="92" x2="122" y2="90" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108" y1="96" x2="122" y2="98" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
</svg>
